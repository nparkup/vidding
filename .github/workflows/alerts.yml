name: 장애·이상 접근 알림

# 보안 체크리스트 101·102·114. 메일 발송 수단이 없어 GitHub 이슈로 알린다: 저장소 주인은 새 이슈·댓글을 GitHub 알림 메일로 받는다.
# 1) 배포·수집 워크플로가 실패하면 그날의 '장애 알림' 이슈를 만들거나 댓글을 단다.
# 2) 매시 중계 서버 ?health 로 최근 1시간 숫자(5xx 오류, 관리자 로그인 실패·잠금, 회원 로그인 실패, 요청 제한)를 보고 기준을 넘으면 '이상 접근 알림' 이슈.
#    ?health 는 관리자 비밀번호(Secrets ADMIN_PASSWORD)에서 만든 키가 있어야 답한다.
on:
  workflow_run:
    workflows: ["GitHub Pages 배포", "기업 정보 중계 서버 배포", "낙찰 저장소 수집"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"   # 매시 17분
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  failed-run:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 실패 알림 이슈
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          TITLE_RUN: ${{ github.event.workflow_run.display_title }}
        run: |
          day=$(TZ=Asia/Seoul date +%Y-%m-%d)
          title="장애 알림 $day"
          body="**$NAME** 실행이 실패했습니다 ($(TZ=Asia/Seoul date '+%H:%M') KST).

          - 실행: $URL
          - 내용: $TITLE_RUN"
          n=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi

  health:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: 최근 1시간 확인
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CORP_API_URL: ${{ vars.CORP_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "ADMIN_PASSWORD 없음: 건너뜀"; exit 0; fi
          url="$CORP_API_URL"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$sub" ] && url="https://bidmate-corp-lookup.$sub.workers.dev"
          fi
          [ -z "$url" ] && { echo "중계 서버 주소 없음"; exit 0; }
          key=$(printf '%s' "bidmate-health:$ADMIN_PASSWORD" | sha256sum | cut -d' ' -f1)
          code=$(curl -sS -o h.json -w '%{http_code}' -H "X-Health-Key: $key" "$url?health=1" || echo 000)
          echo "응답 $code: $(cat h.json 2>/dev/null)"
          msgs=()
          if [ "$code" != "200" ]; then
            # 중계 서버가 답하지 않으면 그것 자체가 장애
            [ "$code" = "403" ] && { echo "키가 맞지 않음(배포 전일 수 있음)"; exit 0; }
            msgs+=("중계 서버가 응답하지 않습니다 (HTTP $code)")
          else
            v() { jq -r ".$1 // 0" h.json; }
            [ "$(v errors5xx)" -ge 10 ] && msgs+=("중계 서버 오류(5xx) $(v errors5xx)건")
            [ "$(v adminLoginFail)" -ge 5 ] && msgs+=("관리자 로그인 실패 $(v adminLoginFail)번")
            [ "$(v adminLocked)" -ge 1 ] && msgs+=("관리자 로그인 잠김 상태에서 시도 $(v adminLocked)번")
            [ "$(v memberLoginFail)" -ge 30 ] && msgs+=("회원 로그인 실패 $(v memberLoginFail)번")
            [ "$(v rateLimited)" -ge 100 ] && msgs+=("요청 제한에 걸린 요청 $(v rateLimited)건")
          fi
          if [ ${#msgs[@]} -eq 0 ]; then echo "이상 없음"; exit 0; fi
          day=$(TZ=Asia/Seoul date +%Y-%m-%d)
          title="이상 접근 알림 $day"
          body="최근 1시간 ($(TZ=Asia/Seoul date '+%H:%M') KST 기준)
          $(printf -- '- %s\n' "${msgs[@]}")

          자세한 기록은 관리자 > 시스템 정보 > 접속·로그에서 볼 수 있습니다."
          n=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi
