name: 코드 보안 검사

# GitHub CodeQL 정적 분석 (보안 체크리스트 119). 코드가 바뀌어 머지될 때와 매주 한 번 돈다. 결과는 저장소 Security 탭.
# 배포와는 별개라 실패해도 사이트 배포를 막지 않는다.
on:
  push:
    branches: [main]
    paths: ["src/**", "worker/**", "scripts/**", ".github/workflows/codeql.yml"]
  pull_request:
    paths: ["src/**", "worker/**", "scripts/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "30 18 * * 0"   # 매주 월요일 03:30 KST
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
