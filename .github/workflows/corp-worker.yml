name: 기업 정보 중계 서버 배포

# 사업자번호 조회용 Cloudflare Worker를 배포하고, 공공데이터포털 서비스키를 Worker 비밀값으로 넣는다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID, DATA_GO_KR_SERVICE_KEY
on:
  push:
    branches: [main]
    paths:
      - "worker/corp-lookup/**"
      - "src/lib/corpLookup.ts"
      - ".github/workflows/corp-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 설정 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포를 건너뜁니다."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 20
      - name: Worker 배포
        if: steps.check.outputs.skip != '1'
        working-directory: worker/corp-lookup
        run: npx --yes wrangler@3 deploy
      - name: 서비스키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1'
        working-directory: worker/corp-lookup
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: printf '%s' "$DATA_GO_KR_SERVICE_KEY" | npx --yes wrangler@3 secret put DATA_GO_KR_SERVICE_KEY
