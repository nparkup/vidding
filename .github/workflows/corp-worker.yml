name: 기업 정보 중계 서버 배포

# 사업자번호 조회용 Cloudflare Worker를 배포하고, 공공데이터포털 서비스키를 Worker 비밀값으로 넣는다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID, DATA_GO_KR_SERVICE_KEY
# 선택: ANTHROPIC_API_KEY (공고 배점표 AI 판독, ?aisheet=). 있으면 Worker 비밀값으로 넣는다
# 선택: ADMIN_ID, ADMIN_PASSWORD (관리자 화면 /admin 로그인, 비밀번호 10자 이상). 있으면 Worker 비밀값으로 넣는다
# 선택: KIPRIS_API_KEY (기업 특허 조회 예비 경로, KIPRIS Plus 인증키). 기본 경로는 공공데이터포털 등록원부라 없어도 된다
# 선택: TURNSTILE_SECRET (가입·로그인 로봇 확인 비밀 키). 사이트 키는 저장소 변수 TURNSTILE_SITE_KEY (pages.yml)
# 선택: BACKUP_KEY (회원·결제 백업 암호화 키, 아무 긴 문자열). 있으면 Worker 비밀값으로 넣는다. 잃어버리면 암호화한 백업을 풀 수 없다
# 권장: MEMBER_KEY (회원 개인정보 암호화 키, 16자 이상 임의 문자열). 잃어버리면 회원 자료를 풀 수 없다. 바꿀 때는 예전 키를 MEMBER_KEY_OLD 에
# 선택: ADMIN_GITHUB_TOKEN (관리자 화면 GitHub Actions 실행 목록, Actions 읽기 권한만). 있으면 Worker 비밀값 GITHUB_TOKEN 으로 넣는다
on:
  push:
    branches: [main]
    paths:
      - "worker/corp-lookup/**"
      - "src/lib/corpLookup.ts"
      - "src/lib/perfLookup.ts"
      - "src/lib/awards/**"
      - "src/lib/nara/aiSheet.ts"
      - "src/lib/nara/liveSheet.ts"
      - "src/lib/noticeCriteria.ts"
      - "src/lib/nara/attachText.ts"
      - "src/lib/nara/hwpText.ts"
      - "src/lib/criteria.ts"
      - "src/lib/evalscore.ts"
      - "src/lib/trustscore.ts"
      - "src/lib/siteConfigCore.ts"
      - "src/lib/plans.ts"
      - "src/lib/trialLimit.ts"
      - "src/lib/usagePeriod.ts"
      - "src/lib/patents.ts"
      - "src/lib/privacy.ts"
      - ".github/workflows/corp-worker.yml"
  # PR에서는 배포하지 않고 Cloudflare 토큰·계정 ID가 맞는지만 확인한다
  pull_request:
    paths:
      - "worker/corp-lookup/**"
      - "src/lib/corpLookup.ts"
      - "src/lib/perfLookup.ts"
      - "src/lib/awards/**"
      - "src/lib/nara/aiSheet.ts"
      - "src/lib/nara/liveSheet.ts"
      - "src/lib/noticeCriteria.ts"
      - "src/lib/nara/attachText.ts"
      - "src/lib/nara/hwpText.ts"
      - "src/lib/criteria.ts"
      - "src/lib/evalscore.ts"
      - "src/lib/trustscore.ts"
      - "src/lib/siteConfigCore.ts"
      - "src/lib/plans.ts"
      - "src/lib/trialLimit.ts"
      - "src/lib/usagePeriod.ts"
      - "src/lib/patents.ts"
      - "src/lib/privacy.ts"
      - ".github/workflows/corp-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 설정 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포를 건너뜁니다."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ]; then exit 1; fi
          fi
      - name: 토큰·계정 확인
        if: steps.check.outputs.skip != '1'
        run: |
          # 사용자 토큰과 계정 토큰은 확인 주소가 다르다: 둘 중 하나가 통과하면 된다
          v=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if ! echo "$v" | jq -e '.success' > /dev/null; then
            v=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          fi
          echo "토큰: $(echo "$v" | jq -r 'if .success then "유효 (" + .result.status + ")" else "오류 " + (.errors|tostring) end')"
          echo "$v" | jq -e '.success and .result.status == "active"' > /dev/null
          s=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          echo "workers.dev: $(echo "$s" | jq -r 'if .success then (.result.subdomain // "없음") + ".workers.dev" else "오류 " + (.errors|tostring) end')"
          echo "$s" | jq -e '.success and (.result.subdomain // "") != ""' > /dev/null
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then echo "DATA_GO_KR_SERVICE_KEY 없음"; exit 1; fi
          echo "DATA_GO_KR_SERVICE_KEY: 있음"
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        with:
          node-version: 20
          cache: npm
      # Worker가 Anthropic SDK(@anthropic-ai/sdk)를 함께 묶는다
      - run: npm ci
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
      # 회원·결제 백업 버킷(backup.ts). 없으면 만들고, 만들 권한이 없으면 백업 바인딩만 빼고 배포한다 (배포가 멈추지 않게)
      - name: 백업 버킷 확인
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        run: |
          code=$(curl -sS -o /tmp/b.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bidmate-backup")
          if [ "$code" != "200" ]; then
            code=$(curl -sS -o /tmp/c.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"name":"bidmate-backup"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")
            echo "백업 버킷 만들기: $code $(jq -c '.errors' /tmp/c.json 2>/dev/null)"
          else
            echo "백업 버킷 있음"
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::백업 버킷 bidmate-backup 을 만들지 못해 백업 없이 배포합니다. Cloudflare 대시보드 R2에서 bidmate-backup 버킷을 만들어 주세요."
            python3 - <<'PY'
          import re
          p = "wrangler.toml"
          s = open(p).read()
          s = re.sub(r'\[\[r2_buckets\]\]\nbinding = "BACKUP"\nbucket_name = "bidmate-backup"\n', "", s)
          open(p, "w").write(s)
          PY
          fi
      - name: Worker 배포
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        run: npx --yes wrangler@4.40.0 deploy
      - name: Turnstile 비밀 키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$TURNSTILE_SECRET" ]; then echo "TURNSTILE_SECRET 없음: 가입·로그인 로봇 확인은 꺼진 채로 둡니다"; exit 0; fi
          printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@4.40.0 secret put TURNSTILE_SECRET
      - name: 백업 암호화 키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then echo "BACKUP_KEY 없음: 백업은 암호화 없이 비공개 버킷에만 둡니다"; exit 0; fi
          printf '%s' "$BACKUP_KEY" | npx --yes wrangler@4.40.0 secret put BACKUP_KEY
      # 회원 개인정보 암호화 키 (sealed.ts). 저장소 Secrets MEMBER_KEY(16자 이상 임의 문자열). 잃어버리면 회원 자료를 풀 수 없으니 따로 보관한다.
      # 키를 바꿀 때는 예전 키를 MEMBER_KEY_OLD 에 함께 넣는다. 지금 암호화에 쓰는 키와 다르고 MEMBER_KEY_OLD 도 없으면 바꾸지 않고 멈춘다(회원 자료가 잠기지 않게).
      - name: 회원 정보 암호화 키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          MEMBER_KEY: ${{ secrets.MEMBER_KEY }}
          MEMBER_KEY_OLD: ${{ secrets.MEMBER_KEY_OLD }}
        run: |
          # Worker(sealed.ts)처럼 앞뒤 공백을 뺀 값으로 키 ID를 셈한다
          MEMBER_KEY="${MEMBER_KEY#"${MEMBER_KEY%%[![:space:]]*}"}"; MEMBER_KEY="${MEMBER_KEY%"${MEMBER_KEY##*[![:space:]]}"}"
          if [ -z "$MEMBER_KEY" ]; then echo "::warning::MEMBER_KEY 없음: 회원 정보는 아직 암호화하지 않습니다. 저장소 Secrets에 MEMBER_KEY(16자 이상 임의 문자열)를 넣고 이 배포를 다시 실행해 주세요."; exit 0; fi
          if [ ${#MEMBER_KEY} -lt 16 ]; then echo "::error::MEMBER_KEY 는 16자 이상이어야 합니다."; exit 1; fi
          kid=$(printf '%s' "bidmate-member-kid:$MEMBER_KEY" | sha256sum | cut -c1-8)
          cur=""
          if npx --yes wrangler@4.40.0 r2 object get bidmate-awards/config/seal-state.json --remote --pipe > /tmp/seal.json 2>/dev/null; then
            cur=$(jq -r '.kid // ""' /tmp/seal.json 2>/dev/null || true)
          fi
          if [ -n "$cur" ] && [ "$cur" != "null" ] && [ "$cur" != "$kid" ] && [ -z "$MEMBER_KEY_OLD" ]; then
            echo "::error::MEMBER_KEY 가 지금 암호화에 쓰는 키와 다릅니다. 예전 키를 MEMBER_KEY_OLD 에 넣어야 바꿀 수 있습니다 (그대로 바꾸면 회원 자료를 풀 수 없습니다)."
            exit 1
          fi
          echo "암호화 키 ID: $kid (지금 저장소 기준: ${cur:-아직 없음})"
          # 암호화 진행 상태(건수만, 내용 없음): 매시 25분 예약 작업이 남은 평문을 암호화한다
          if [ -s /tmp/seal.json ]; then echo "암호화 상태: $(jq -c '{sealed,plain,otherKey,done,at}' /tmp/seal.json 2>/dev/null)"; fi
          printf '%s' "$MEMBER_KEY" | npx --yes wrangler@4.40.0 secret put MEMBER_KEY
          if [ -n "$MEMBER_KEY_OLD" ]; then printf '%s' "$MEMBER_KEY_OLD" | npx --yes wrangler@4.40.0 secret put MEMBER_KEY_OLD; fi
      - name: 서비스키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: printf '%s' "$DATA_GO_KR_SERVICE_KEY" | npx --yes wrangler@4.40.0 secret put DATA_GO_KR_SERVICE_KEY
      - name: Anthropic API 키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY 없음: AI 판독은 꺼진 채로 둡니다"; exit 0; fi
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.40.0 secret put ANTHROPIC_API_KEY
      - name: KIPRIS Plus 인증키를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
        run: |
          if [ -z "$KIPRIS_API_KEY" ]; then echo "KIPRIS_API_KEY 없음: 특허 조회는 꺼진 채로 둡니다 (Cloudflare에서 직접 넣은 값은 그대로 둡니다)"; exit 0; fi
          printf '%s' "$KIPRIS_API_KEY" | npx --yes wrangler@4.40.0 secret put KIPRIS_API_KEY
      - name: 관리자 아이디·비밀번호를 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_ID" ] || [ -z "$ADMIN_PASSWORD" ]; then echo "ADMIN_ID / ADMIN_PASSWORD 없음: 관리자 로그인은 꺼진 채로 둡니다"; exit 0; fi
          if [ ${#ADMIN_PASSWORD} -lt 10 ]; then echo "ADMIN_PASSWORD 는 10자 이상이어야 합니다: 관리자 로그인은 꺼진 채로 둡니다"; exit 0; fi
          printf '%s' "$ADMIN_ID" | npx --yes wrangler@4.40.0 secret put ADMIN_ID
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.40.0 secret put ADMIN_PASSWORD
      # 선택: 관리자 화면 시스템 정보의 GitHub Actions 실행 목록. 없으면 공개 API(시간당 60회)로 읽는다
      - name: GitHub 읽기 토큰을 Worker 비밀값으로 저장
        if: steps.check.outputs.skip != '1' && github.event_name != 'pull_request'
        working-directory: worker/corp-lookup
        env:
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          if [ -z "$ADMIN_GITHUB_TOKEN" ]; then echo "ADMIN_GITHUB_TOKEN 없음: 공개 API로 읽습니다"; exit 0; fi
          printf '%s' "$ADMIN_GITHUB_TOKEN" | npx --yes wrangler@4.40.0 secret put GITHUB_TOKEN
