name: kapt-probe (temporary)
on:
  push:
    branches: [claude/project-thread-fxcz9d]
    paths: [".github/workflows/kapt-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          cat > p.mjs <<'JS'
          const B = "https://apis.data.go.kr/1613000/ApHusBidResultNoticeInfoOfferServiceV3";
          const q = (op, p) => fetch(`${B}/${op}?` + new URLSearchParams({ serviceKey: process.env.KEY, _type: "json", pageNo: "1", ...p })).then(r => r.text());
          const items = (t) => { try { const j = JSON.parse(t); let it = j?.response?.body?.items; it = it?.item ?? it; return Array.isArray(it) ? it : it ? [it] : []; } catch { console.log("RAW", t.slice(0, 300)); return []; } };
          const SAFE = /amt|amount|price|money|rank|rate|yn|cnt|count|num|date|de$|state|sttus|seq|order|rnk/i;
          const BAD = /tel|phone|hp|mobile|charge|manager|person|mail|fax|addr|ceo|rprsnt/i;
          let shown = 0, withNum = 0, total = 0;
          for (const page of ["1","2","3"]) {
            const aw = items(await q("getBidSttusSearchV3", { bidState: "5", searchYear: "2026", numOfRows: "100", pageNo: page }));
            for (const a of aw) {
              total++;
              const c = String(a.bidResultContent ?? "").replace(/\d{2,4}[-) .]\d{3,4}[- .]\d{4}/g, "[전화]");
              if (/\d{1,3}(,\d{3}){2,}|\d{7,}/.test(c)) { withNum++; if (shown++ < 25) console.log("RC", a.bidNum, "amount=", a.amount, "|", c.replace(/\s+/g, " ").slice(0, 300)); }
            }
          }
          console.log("total", total, "withNum", withNum);
          JS
          node p.mjs
