name: kipo-probe (임시)
on:
  push:
    branches: [claude/project-thread-x5jz9i]
    paths: [".github/workflows/kipo-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 등록원부 사업자 권리목록 조회 확인
        env:
          K: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          base="https://apis.data.go.kr/1430000/PttRgstRtInfoInqSvc/getBusinessRightList"
          : > probe-out.txt
          for v in "301-81-08302" "3018108302" "124-81-00998" "1248100998"; do
            echo "=== searchVal=$v" >> probe-out.txt
            curl -sS -m 25 -G "$base" --data-urlencode "serviceKey=$K" -d pageNo=1 -d numOfRows=3 -d type=json -d searchType=1 --data-urlencode "searchVal=$v" -w "\nHTTP %{http_code}\n" 2>&1 | head -c 3000 >> probe-out.txt || true
            echo >> probe-out.txt
          done
          python3 - <<'PY'
          import os
          k=os.environ["K"]; p="probe-out.txt"; s=open(p).read()
          for v in {k, k.replace("+","%2B").replace("/","%2F").replace("=","%3D")}: s=s.replace(v,"KEY")
          open(p,"w").write(s)
          PY
          mkdir -p .probe && mv probe-out.txt .probe/out.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add .probe/out.txt && git commit -m "probe result [skip ci]" && git push
