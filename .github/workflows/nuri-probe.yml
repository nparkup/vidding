name: nuri-probe (임시)
on:
  push:
    branches: [claude/project-thread-gjn4s8]
    paths: [scripts/score/nuri-sheet-probe.ts, .github/workflows/nuri-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npx tsx --conditions=react-server scripts/score/nuri-sheet-probe.ts
