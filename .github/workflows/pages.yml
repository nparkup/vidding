name: GitHub Pages 배포

# 영업일 아침·점심·저녁(KST 06:40, 11:40, 16:40)에 나라장터 공고를 새로 받아 사이트를 다시 만든다.
# main 머지(push) 배포는 화면 코드만 바뀌었으면 공고를 다시 받지 않고 직전 배포 자료(data/bids.json)를 캐시에서 꺼내 쓴다.
# 수집 코드(scripts/fetch-deps.mjs 가 찾는 파일)나 패키지가 바뀌었거나, 저장된 자료가 없거나 4일 넘게 묵었으면 새로 받는다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 21 * * 0-4"   # 월~금 06:40 KST
    - cron: "40 2,7 * * 1-5"  # 월~금 11:40, 16:40 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 자료 받기 방식 결정 (머지 배포는 수집 코드가 바뀌었는지 본다)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          mode=fetch; why="정기·수동 배포는 항상 새로 받음"
          if [ "$EVENT" = push ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git fetch -q --depth=1 origin "$BEFORE"; then
              git diff --name-only "$BEFORE" HEAD | sort > /tmp/changed.txt
              { node scripts/fetch-deps.mjs; echo package.json; echo package-lock.json; } | sort -u > /tmp/deps.txt
              hit=$(comm -12 /tmp/changed.txt /tmp/deps.txt | head -5 | paste -sd, -)
              if [ -n "$hit" ]; then why="수집 코드가 바뀜: $hit"; else mode=reuse; why="화면 코드만 바뀜"; fi
            else
              why="직전 커밋을 못 찾아 바뀐 파일을 알 수 없음"
            fi
          fi
          echo "판단: $mode ($why)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: 직전 배포 자료 복원
        if: steps.plan.outputs.mode == 'reuse'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bids.json
            data/synced-at
          key: bids-data-${{ github.run_id }}
          restore-keys: bids-data-
      - name: 자료 재사용 여부 확정
        id: mode
        env:
          PLAN: ${{ steps.plan.outputs.mode }}
        run: |
          mode=fetch
          if [ "$PLAN" = reuse ]; then
            if [ -s data/bids.json ] && [ -s data/synced-at ]; then
              age=$(( $(date -u +%s) - $(cat data/synced-at) ))
              if [ "$age" -lt 345600 ]; then
                mode=reuse
                echo "직전 배포 자료 재사용: $(date -u -d @"$(cat data/synced-at)" '+%Y-%m-%d %H:%M UTC')에 받은 자료 ($((age / 3600))시간 전)"
              else
                echo "저장된 자료가 4일 넘게 묵어 새로 받음 ($((age / 3600))시간 전)"
              fi
            else
              echo "저장된 자료가 없어 새로 받음"
            fi
          fi
          [ "$mode" = fetch ] && rm -f data/bids.json data/synced-at
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      # 전년도 낙찰률 자료는 바뀌지 않으므로 받은 만큼 캐시에 두고 다음 빌드가 이어 받는다
      - name: 전년도 낙찰률 캐시 복원
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/award
          key: award-stats-${{ github.run_id }}
          restore-keys: award-stats-
      # 첨부 본문은 한 번 읽으면 바뀌지 않으므로 캐시에 두고 다음 빌드는 새 첨부만 받는다 (scripts/attachCache.ts)
      - name: 첨부 본문 캐시 복원
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/attach-text
          key: attach-text-${{ github.run_id }}
          restore-keys: attach-text-
      # 계약현황은 지난 날짜 계약이 바뀌지 않으므로 날짜별로 캐시에 두고 다음 빌드는 최근 이틀만 다시 받는다 (src/lib/nara/contract.ts)
      - name: 계약현황 캐시 복원
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/contracts
          key: contracts-${{ github.run_id }}
          restore-keys: contracts-
      # 공동주택 지난 연도 낙찰·단지별 수의계약은 캐시에 두고 다음 빌드는 아직 안 물어본 단지부터 묻는다 (src/lib/kapt/client.ts)
      - name: 공동주택 캐시 복원
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/apt
          key: apt-${{ github.run_id }}
          restore-keys: apt-
      # 누리장터 지난 주 공고·개찰 결과·계약과 업종 근거법규는 캐시에 두고 다음 빌드는 새 기간만 묻는다 (src/lib/nara/nuri.ts)
      - name: 누리장터 캐시 복원
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/nuri
          key: nuri-${{ github.run_id }}
          restore-keys: nuri-
      - name: 나라장터 공고 수집
        if: steps.mode.outputs.mode == 'fetch'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # 낙찰 저장소(R2)에서 낙찰률 통계와 공고 분류를 읽는다. 없으면 예전 방식으로 간다
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 첨부 PDF·HWP 본문과 낙찰 색인을 한 프로세스에서 읽어 기본 힙(약 2GB)을 넘길 때가 있다
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsx --conditions=react-server scripts/fetch-bids.ts data/bids.json
      - name: 전년도 낙찰률 캐시 저장
        if: always() && steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: .cache/award
          key: award-stats-${{ github.run_id }}
      - name: 첨부 본문 캐시 저장
        if: always() && steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: .cache/attach-text
          key: attach-text-${{ github.run_id }}
      - name: 계약현황 캐시 저장
        if: always() && steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: .cache/contracts
          key: contracts-${{ github.run_id }}
      - name: 공동주택 캐시 저장
        if: always() && steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: .cache/apt
          key: apt-${{ github.run_id }}
      - name: 누리장터 캐시 저장
        if: always() && steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: .cache/nuri
          key: nuri-${{ github.run_id }}
      # 다음 머지 배포가 다시 쓸 수 있게 새로 받은 공고 자료를 캐시에 둔다 (오래된 항목은 GitHub이 7일 뒤·10GB 넘으면 지운다)
      - name: 배포 자료 저장
        if: steps.mode.outputs.mode == 'fetch'
        run: date -u +%s > data/synced-at
      - name: 배포 자료 캐시 저장
        if: steps.mode.outputs.mode == 'fetch'
        uses: actions/cache/save@v4
        with:
          path: |
            data/bids.json
            data/synced-at
          key: bids-data-${{ github.run_id }}
      - name: 기업 정보 중계 서버 주소 확인
        id: corp
        env:
          CORP_API_URL: ${{ vars.CORP_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 저장소 변수 CORP_API_URL 이 있으면 그대로, 없으면 Cloudflare 계정의 workers.dev 주소로 만든다
          url="$CORP_API_URL"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$sub" ] && url="https://bidmate-corp-lookup.$sub.workers.dev"
          fi
          echo "중계 서버: ${url:-없음 (사업자번호 조회 꺼짐)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # 발주기관 CI는 위키미디어 공용에서 받아 사이트에 함께 올린다(직접 링크하지 않음). 받은 파일은 캐시에 두고 새 파일만 받는다
      - name: 발주기관 CI 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: public/agency-logos
          key: agency-logos-${{ hashFiles('scripts/agency-logos/sources.json') }}
          restore-keys: agency-logos-
      - name: 발주기관 CI 받기
        run: node scripts/agency-logos/fetch.mjs
      - name: 발주기관 CI 캐시 저장
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: public/agency-logos
          key: agency-logos-${{ hashFiles('scripts/agency-logos/sources.json') }}
      # 업종별 분석의 기간(최근 4년·전체·연도별) 낙찰 업체·발주기관 자료. 자료 재사용 배포에서도 받는다 (실패해도 계속)
      - name: 업종 기간 자료 받기
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/awards/industryFiles.ts public/industry-period
      - name: 정적 사이트 빌드
        env:
          BIDS_FILE: data/bids.json
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APPLY_EMAIL: ${{ vars.APPLY_EMAIL }}
          # 로봇 확인 위젯 사이트 키 (Cloudflare Turnstile, 공개 값이라 변수). 비밀 키는 Secrets TURNSTILE_SECRET → Worker
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CORP_API: ${{ steps.corp.outputs.url }}
          NEXT_TELEMETRY_DISABLED: "1"
          # 정적 페이지 3만여 개를 만드는 워커마다 공고 파일 전체를 읽어 기본 힙(약 4GB)을 넘길 때가 있다 (2026-11-20 run 44705858677)
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_BUILD_CPUS: "2"
        run: node scripts/build-static.mjs
      # 발주처 분석 업종·기간 선택용 자료 (정적 빌드가 만든 발주처 목록 기준, 실패해도 계속)
      - name: 발주처 업종·기간 자료 받기
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsx scripts/awards/agencyCuts.ts out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
