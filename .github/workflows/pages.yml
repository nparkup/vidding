name: GitHub Pages 배포

# 영업일 아침·점심·저녁(KST 06:40, 11:40, 16:40)에 나라장터 공고를 새로 받아 사이트를 다시 만든다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 21 * * 0-4"   # 월~금 06:40 KST
    - cron: "40 2,7 * * 1-5"  # 월~금 11:40, 16:40 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 전년도 낙찰률 자료는 바뀌지 않으므로 받은 만큼 캐시에 두고 다음 빌드가 이어 받는다
      - name: 전년도 낙찰률 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/award
          key: award-stats-${{ github.run_id }}
          restore-keys: award-stats-
      # 첨부 본문은 한 번 읽으면 바뀌지 않으므로 캐시에 두고 다음 빌드는 새 첨부만 받는다 (scripts/attachCache.ts)
      - name: 첨부 본문 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/attach-text
          key: attach-text-${{ github.run_id }}
          restore-keys: attach-text-
      # 계약현황은 지난 날짜 계약이 바뀌지 않으므로 날짜별로 캐시에 두고 다음 빌드는 최근 이틀만 다시 받는다 (src/lib/nara/contract.ts)
      - name: 계약현황 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/contracts
          key: contracts-${{ github.run_id }}
          restore-keys: contracts-
      # 공동주택 지난 연도 낙찰·단지별 수의계약은 캐시에 두고 다음 빌드는 아직 안 물어본 단지부터 묻는다 (src/lib/kapt/client.ts)
      - name: 공동주택 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/apt
          key: apt-${{ github.run_id }}
          restore-keys: apt-
      - name: 나라장터 공고 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # 낙찰 저장소(R2)에서 낙찰률 통계와 공고 분류를 읽는다. 없으면 예전 방식으로 간다
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 첨부 PDF·HWP 본문과 낙찰 색인을 한 프로세스에서 읽어 기본 힙(약 2GB)을 넘길 때가 있다
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsx --conditions=react-server scripts/fetch-bids.ts data/bids.json
      - name: 전년도 낙찰률 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/award
          key: award-stats-${{ github.run_id }}
      - name: 첨부 본문 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/attach-text
          key: attach-text-${{ github.run_id }}
      - name: 계약현황 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/contracts
          key: contracts-${{ github.run_id }}
      - name: 공동주택 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/apt
          key: apt-${{ github.run_id }}
      - name: 기업 정보 중계 서버 주소 확인
        id: corp
        env:
          CORP_API_URL: ${{ vars.CORP_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 저장소 변수 CORP_API_URL 이 있으면 그대로, 없으면 Cloudflare 계정의 workers.dev 주소로 만든다
          url="$CORP_API_URL"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            [ -n "$sub" ] && url="https://bidmate-corp-lookup.$sub.workers.dev"
          fi
          echo "중계 서버: ${url:-없음 (사업자번호 조회 꺼짐)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 정적 사이트 빌드
        env:
          BIDS_FILE: data/bids.json
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APPLY_EMAIL: ${{ vars.APPLY_EMAIL }}
          NEXT_PUBLIC_CORP_API: ${{ steps.corp.outputs.url }}
          NEXT_TELEMETRY_DISABLED: "1"
          # 공고·낙찰 JSON을 읽다 Node 기본 힙(약 2GB)을 넘겨 빌드가 멈추는 문제 (공고 수집 단계와 같은 6GB)
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
