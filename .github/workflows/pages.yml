name: GitHub Pages 배포

# 영업일 아침·점심·저녁(KST 06:40, 11:40, 16:40)에 나라장터 공고를 새로 받아 사이트를 다시 만든다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 21 * * 0-4"   # 월~금 06:40 KST
    - cron: "40 2,7 * * 1-5"  # 월~금 11:40, 16:40 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 나라장터 공고 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npx tsx --conditions=react-server scripts/fetch-bids.ts data/bids.json
      - name: 정적 사이트 빌드
        env:
          BIDS_FILE: data/bids.json
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APPLY_EMAIL: ${{ vars.APPLY_EMAIL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: node scripts/build-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
