name: 공고 평가표 대조

# 실제 공고 첨부에서 읽은 평가 기준과 평가점수 예측이 쓰는 기준을 대조해 로그와 산출물로 남긴다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "공고일 (YYYYMMDD, 쉼표로 여러 날). ids 만 시험하려면 비워 두기"
        required: false
      ids:
        description: "AI 배점표 판독 시험할 공고번호 (쉼표로 여러 개, 예: R26BK01826659)"
        required: false
      per:
        description: "묶음(업무 × 지자체/국가)당 공고 수"
        default: "4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: AI 배점표 판독 시험
        if: inputs.ids != ''
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_SHEET_MODEL: ${{ vars.AI_SHEET_MODEL }}
          IDS: ${{ inputs.ids }}
          DUMP_TEXT: "1"
        run: npx tsx --conditions=react-server scripts/score/ai-sheet-try.ts "$IDS"
      - name: 중계 서버 첨부 바로 읽기 시험 (임시)
        if: inputs.ids != ''
        working-directory: worker/corp-lookup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDS: ${{ inputs.ids }}
        run: |
          printf 'ANTHROPIC_API_KEY=%s\nDATA_GO_KR_SERVICE_KEY=x\n' "$ANTHROPIC_API_KEY" > .dev.vars
          (npx --yes wrangler@4.40.0 dev --local --port 8787 > ../../wd.log 2>&1 &)
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          for id in $(echo "$IDS" | tr ',' ' '); do
            case "$id" in *-*) ;; *) id="$id-000";; esac
            echo "=== $id"
            s=$(date +%s); curl -s -m 170 "http://127.0.0.1:8787/?aisheet=$id" > out.json; echo "($(( $(date +%s) - s ))초)"
            node -e 'const d=require("./out.json"); console.log(JSON.stringify({status:d.status,reason:d.reason,by:d.by,read:d.read,failed:d.failed,usage:d.usage,title:d.sheet?.title,pass:d.sheet?.pass,items:d.sheet?.items?.map(i=>`${i.label} ${i.max}`)},null,1))'
            s=$(date +%s); curl -s -m 60 -o /dev/null -D - "http://127.0.0.1:8787/?aisheet=$id" | grep -i x-cache; echo "(다시 부름 $(( $(date +%s) - s ))초)"
          done
          grep -i "error" ../../wd.log | head -20 || true
      - name: 대조
        if: inputs.days != '' || inputs.ids == ''
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npx tsx --conditions=react-server scripts/score/sheet-audit.ts "${{ inputs.days || '20261112,20261113,20261116,20261117' }}" "${{ inputs.per || '8' }}"
      - uses: actions/upload-artifact@v4
        if: inputs.days != '' || inputs.ids == ''
        with:
          name: sheet-audit
          path: sheet-audit.json.gz
          retention-days: 7
