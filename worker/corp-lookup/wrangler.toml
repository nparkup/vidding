# 기업 정보 중계 서버. 배포: .github/workflows/corp-worker.yml (또는 이 폴더에서 npx wrangler deploy)
name = "bidmate-corp-lookup"
main = "index.ts"
compatibility_date = "2026-10-01"
# 첨부 읽기(src/lib/nara/attachText.ts)가 Buffer·zlib·crypto 를 쓴다
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 매일 0시 10분(한국 = UTC 15:10): 이용권이 끝난 회원 탈퇴 예약 처리 (account.ts processDueWithdrawals), 회원·결제 자료 백업 (backup.ts)
[triggers]
crons = ["10 15 * * *"]

[vars]
# 운영에는 실제 사이트만 둔다. 로컬 개발은 wrangler dev --var ALLOWED_ORIGINS:http://localhost:3000 처럼 따로 준다
ALLOWED_ORIGINS = "https://nparkup.github.io"
# 배점표 판독·같은 사업 판정이 하루에 Claude를 새로 부르는 상한 (security.ts takeAiBudget)
AI_DAILY_LIMIT = "1500"
# 공고 배점표 AI 판독: 입력 파일(/ai-input/{공고}.json)을 읽어 올 사이트와 모델. 키는 비밀값 ANTHROPIC_API_KEY
SITE_URL = "https://nparkup.github.io/vidding"
AI_SHEET_MODEL = "claude-haiku-5-5"

# 낙찰 3년치 저장소. scripts/awards/collect.ts (.github/workflows/awards.yml) 가 채운다
[[r2_buckets]]
binding = "AWARDS"
bucket_name = "bidmate-awards"

# 회원·결제 자료 백업 (backup.ts). 공개 주소를 켜지 않는 별도 버킷. corp-worker.yml 이 없으면 만든다
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "bidmate-backup"

# 실시간 이용자 수 (?presence=). 무료 요금제에서도 되는 SQLite 기반 Durable Object. 저장소에는 쓰지 않고 메모리만 쓴다
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

# 운영 지표 (관리자 화면 시스템 정보·API 사용량·회원 사용량, metrics.ts). 날짜별 집계와 최근 요청 기록만 SQLite에 둔다
[[durable_objects.bindings]]
name = "METRICS"
class_name = "Metrics"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Metrics"]

# 요청 제한 (security.ts, IP마다 1분). namespace_id 는 계정 안에서 겹치지 않는 아무 숫자
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "2611001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AI"
namespace_id = "2611002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "2611003"
simple = { limit = 120, period = 60 }
